# Mayfair Apartment 8-Camera Strategic Topology & Sync Configuration
# Dataset: 8 cameras, ~15 mins each, Mayfair Apartment building
# Corrected per Owner Ground Truth:
# Ground floor: CAM 1, 2, 3, 4, 5 (CAM 3 & 4 = Entrance; CAM 1, 2, 5 = Sides)
# First floor: CAM 6 (Staircase & Flat 1A/1B)
# Second floor: CAM 7 (Staircase & Flat 2A/2B)
# Terrace / Rooftop: CAM 8

global_timeline:
  duration_sec: 900.0  # 15 minutes max
  fps: 15.0
  lost_timeout_sec: 1.5
  neighbor_search_timeout_sec: 30.0
  low_rate_check_hz: 1.0
  acquisition_threshold: 0.65
  reacquisition_fusion_threshold: 0.55

cameras:
  cam1:
    camera_id: cam1
    name: "Ground Floor East Walkway"
    floor: 0
    floor_name: "Ground Floor"
    video_path: "data/videos/CAM 1.mp4"
    duration_sec: 839.56
    time_offset_sec: 5.0  # DVR clock: 05:45:05 PM (+5s vs CAM 7)
    map_coords:
      x: 0.833  # 1000/1200
      y: 0.412  # 330/800
    fov_angle: 180
    neighbors: ["cam2", "cam5"]
    transit_bounds_sec:
      cam2: [1.0, 15.0]
      cam5: [2.0, 20.0]
    exit_zones:
      - name: "To SE Corner / Gate"
        box: [0.15, 0.70, 0.65, 1.00]
        is_terminal: false
        handoff_cam: "cam2"
      - name: "To North Walkway"
